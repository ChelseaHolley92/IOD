<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name=" viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation</title>
<style>
p { animation-name: slidein;
animation-duration: 3s; }

@keyframes slidein {
from { margin-left: 100%; }
to { margin-left: 0; }
}
</style>
</head>
<body>
<p>Hello World!</p>
</body>
</html>
