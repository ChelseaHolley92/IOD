<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name=" viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation</title>
<style>
    #animationBox { width: 100px; height: 100px; position:absolute; top:100px;
        animation-name: slide; animation-duration: 5s; animation-iteration-count: infinite; animation-direction: alternate-reverse;

        @keyframes slidein {
from { margin-left: 100%; }
50% { font-size: 300%; margin-left: 40%; }
to { margin-left: 0; }
}
</style>
</head>
<body>
<p>Hello World!</p>
</body>
</html>
